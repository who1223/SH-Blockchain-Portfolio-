    if(file_exists("posts.txt")){
        $posts = file("posts.txt");
        $posts = array_reverse($posts);
        foreach($posts as $post){
            $data = explode("||", $post);
            echo '<div class="post">';
            echo "<b>নাম:</b> ".htmlspecialchars($data[0])."<br>";
            echo "<b>বার্তা:</b> ".htmlspecialchars($data[1])."<br>";
            if(!empty($data[2])) echo "<b>ফাইল:</b> <a href='uploads/".htmlspecialchars($data[2])."' target='_blank'>".htmlspecialchars($data[2])."</a>";
            echo "</div>";
        }
    }
