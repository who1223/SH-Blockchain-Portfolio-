<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SH Blockchain — Web3 Future</title>
<meta name="description" content="SH Blockchain Web3 Platform">
<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<!-- MATRIX BACKGROUND -->
<canvas id="matrix"></canvas>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="logo">🚀 SH Blockchain</div>

  <div class="wallet-box">
    <button class="wallet-btn" id="connectWallet">Connect Wallet</button>
    <button class="copy-btn" id="copyWallet">Copy</button>
    <span id="walletAddress" class="wallet-address"></span>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1>Next Generation Blockchain</h1>
    <p>Secure • Fast • Decentralized</p>
    <button class="btn" id="contractBtn">Run Smart Contract</button>
    <p id="contractResult"></p>
  </div>
</section>

<!-- SERVICES -->
<section class="section">
  <h2>Our Services</h2>

  <div class="cards">
    <div class="card">
      <h3>Smart Contracts</h3>
      <p>Secure Solidity development.</p>
    </div>

    <div class="card">
      <h3>Web3 Integration</h3>
      <p>MetaMask & wallet systems.</p>
    </div>

    <div class="card">
      <h3>Security Audit</h3>
      <p>Advanced crypto protection.</p>
    </div>
  </div>
</section>

<!-- LIVE CHART -->
<section class="section">
  <h2>Crypto Market</h2>
  <canvas id="cryptoChart"></canvas>
</section>

<!-- CONTACT -->
<section class="section">
  <h2>Contact</h2>
  <form class="contact-form" onsubmit="event.preventDefault(); showToast('✅ Message sent');">
    <input type="text" placeholder="Your name" required>
    <input type="email" placeholder="Your email" required>
    <textarea placeholder="Message"></textarea>
    <button class="btn">Send Message</button>
  </form>
</section>

<footer>
  <p>© 2026 SH Blockchain — TITAN MODE</p>
</footer>

<script src="script.js"></script>
</body>
</html>
